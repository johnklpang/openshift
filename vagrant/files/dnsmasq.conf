# Cluster DNS for OpenShift UPI. Bound to the helper host-only address.
listen-address=__HELPER_IP__
bind-interfaces
domain=__DOMAIN__
local=/__DOMAIN__/
expand-hosts
no-resolv

address=/api.__DOMAIN__/__HELPER_IP__
address=/api-int.__DOMAIN__/__HELPER_IP__
address=/.apps.__DOMAIN__/__HELPER_IP__

address=/helper.__DOMAIN__/__HELPER_IP__
address=/master.__DOMAIN__/__MASTER_IP__
address=/worker1.__DOMAIN__/__WORKER1_IP__
address=/worker2.__DOMAIN__/__WORKER2_IP__
